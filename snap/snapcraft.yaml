name: cyperuscoi # you probably want to 'snapcraft register <name>'
base: core24 # the base snap is the execution environment for this snap
version: '1.0.0' # just for humans, typically '1.2+git' or '1.3.2'
summary: Native QR code scanner for Linux # 79 char long summary
description: |
  CoBang can scan barcode, QR code from webcam or from static image.
  It is set to support both Wayland and X11, and only implements a native
  GUI (no web crap).

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: devmode # use 'strict' once you have the right plugs and slots

parts:
  cobang:
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
    source: .
    build-packages:
      - meson
      - ninja-build
      - libglib2.0-bin
      - libglib2.0-dev-bin
      - gir1.2-gtk-3.0
      - libhandy-1-dev
      - desktop-file-utils
    stage-packages:
      - python3-gi
      - python3-gst-1.0
      - gir1.2-gtk-3.0
      - gir1.2-handy-1
      - gir1.2-xdpgtk3-1.0
      - gstreamer1.0-gtk3
      - gir1.2-gst-plugins-base-1.0
      - gstreamer1.0-plugins-good
      - gir1.2-nm-1.0
      - gir1.2-rsvg-2.0
      - python3-logbook
      - python3-zbar
      - python3-pil
